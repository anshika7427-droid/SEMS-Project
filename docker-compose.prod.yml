version: "3.9"
services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - sems_data:/app/data
      - sems_storage:/app/storage
    environment:
      - GUNICORN_WORKERS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sems_data:
  sems_storage:
